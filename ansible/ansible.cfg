[defaults]
inventory = inventory.yml
roles_path = roles
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 4

[ssh_connection]
# Lab VMs are recreated often, so their host keys change. Accept new keys,
# but keep them out of your real ~/.ssh/known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts
pipelining = True
